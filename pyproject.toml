[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mebway-mcp"
version = "0.1.0"
description = "Public Mebway MCP connection examples and offline presentation viewer"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
mebway-mcp = "mebway_mcp.__main__:main"

[tool.setuptools]
packages = ["mebway_mcp"]
